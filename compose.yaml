# Stack local.
#   docker compose up --build        app completa en http://localhost:3000
#                                    (db + migraciones + seed + app)
#   docker compose up -d db          solo la base de datos, para `pnpm dev`
# Producción usa compose.prod.yaml (Caddy + imágenes de GHCR).
name: portfolio

x-db-urls: &db-urls
  DATABASE_URL: postgres://portfolio_app:${DB_APP_PASSWORD}@db:5432/${DB_NAME:-portfolio}
  MIGRATION_DATABASE_URL: postgres://portfolio_owner:${DB_OWNER_PASSWORD}@db:5432/${DB_NAME:-portfolio}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-portfolio}
      # Solo en local: una segunda base de datos para los tests de integración.
      CREATE_TEST_DB: "true"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    ports:
      # Solo loopback: accesible desde esta máquina para `pnpm dev`, nunca desde la LAN.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-portfolio}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Job de un solo uso: migraciones con el rol propietario y después un seed idempotente.
  migrate:
    build: { context: ., target: migrator }
    environment:
      <<: *db-urls
      # El contenido privado se monta en tiempo de ejecución; nunca se incluye en la imagen.
      SEED_FILE: /app/seed-private/content.local.json
    volumes:
      - ./db/seed:/app/seed-private:ro
    command: ["sh", "-c", "node_modules/.bin/tsx scripts/migrate.ts && node_modules/.bin/tsx db/seed/index.ts"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner, args: { APP_VERSION: "${APP_VERSION:-local}" } }
    environment:
      DATABASE_URL: postgres://portfolio_app:${DB_APP_PASSWORD}@db:5432/${DB_NAME:-portfolio}
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /app/.next/cache:uid=1000,gid=1000
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  pgdata:
